[package]
name    = "agentmux-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "agentmux CLI — user-facing command-line interface and TUI client entry point"

[features]
activity-feed = ["agentmux-tui/activity-feed"]
arena = ["agentmux-tui/arena"]

[[bin]]
name = "agentmux"
path = "src/main.rs"

[[bin]]
name = "agentmux-poc"
path = "src/bin/agentmux-poc.rs"

[dependencies]
agentmux-core = { workspace = true }
agentmux-ipc  = { workspace = true }
agentmux-pty  = { workspace = true }
agentmux-store = { workspace = true }
agentmux-terminal = { workspace = true }
agentmux-tui  = { workspace = true }
clap          = { workspace = true }
crossterm     = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }

[dev-dependencies]
# `start_paused` tests need tokio's paused clock so daemon-timeout regression
# tests complete instantly instead of sleeping for the real timeout.
tokio         = { workspace = true, features = ["test-util"] }
